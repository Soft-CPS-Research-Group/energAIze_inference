name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pilot:
        description: Publish the tested commit as a separate SoftCPS pilot image
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint / syntax check
        run: python -m compileall app tests
      - name: Run tests
        run: pytest

  docker:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_pilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: calof/energaize_inference:${{ github.event_name == 'workflow_dispatch' && format('pilot-{0}', github.sha) || 'latest' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=calof/energaize_inference:buildcache
          cache-to: type=registry,ref=calof/energaize_inference:${{ github.event_name == 'workflow_dispatch' && 'pilot-buildcache' || 'buildcache' }},mode=max
