# Override compose.preparation.yml on JetPack 5.1.1 / L4T 35.3.1 ARM64.
services:
  inference:
    build:
      dockerfile: Dockerfile.jetson
    image: "${JETSON_INFERENCE_IMAGE:-energaize-inference:jetson-jp5}"
    runtime: nvidia
    environment:
      ONNX_EXECUTION_PROVIDERS: CPUExecutionProvider
      TENSORRT_ENABLED: "true"
      DEPLOYMENT_MODEL_ID: "${DEPLOYMENT_MODEL_ID:?Set the Percepta model route}"
      PERCEPTA_CYCLE_TOKEN: "${PERCEPTA_CYCLE_TOKEN:?Supply the separate cycle secret}"
